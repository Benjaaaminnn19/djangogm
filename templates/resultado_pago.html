{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Resultado del Pago</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container my-5 text-center">
        {% if exitoso %}
            <div class="alert alert-success">
                <h1>✓ ¡Pago Exitoso!</h1>
                <p>Tu orden <strong>{{ orden.orden_id }}</strong> ha sido procesada correctamente.</p>
                <p>Total pagado: ${{ orden.total|intcomma }}</p>
            </div>
        {% else %}
            <div class="alert alert-danger">
                <h1>✗ Pago Fallido</h1>
                <p>Hubo un problema al procesar tu pago.</p>
            </div>
        {% endif %}
        
        <a href="{% url 'tienda' %}" class="btn btn-primary">Volver a la Tienda</a>
    </div>
</body>
</html>
