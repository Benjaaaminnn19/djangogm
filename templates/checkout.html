{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Checkout - Gimnasio Leblon</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container my-5">
        <h2>Finalizar Compra</h2>
        
        <form method="POST" action="{% url 'iniciar_pago' %}">
            {% csrf_token %}
            
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" name="email" required>
            </div>
            
            <div class="mb-3">
                <label for="total" class="form-label">Total a Pagar</label>
                <input type="number" class="form-control" id="total" name="total" readonly value="27900">
            </div>
            
            <input type="hidden" name="productos" id="productos" value='[]'>
            
            <button type="submit" class="btn btn-primary btn-lg">
                Pagar con Flow
            </button>
        </form>
    </div>
</body>
</html>
