[phases.setup]
nixPkgs = ['python310', 'postgresql']
aptPkgs = ['default-libmysqlclient-dev']

[phases.install]
cmds = ['pip install -r requirements.txt']

[phases.build]
cmds = ['python manage.py collectstatic --noinput']

[start]
cmd = 'gunicorn gym_leblon.wsgi:application --bind 0.0.0.0:$PORT'

[variables]
NIXPACKS_NO_MUSL = '1'